[package]
name = "linkshot-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen, window and region capture for linkshot"

[dependencies]
linkshot-core.workspace = true
linkshot-video.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
serde.workspace = true
xcap = "0.9"
crossbeam-channel.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "remote_desktop", "screencast"] }
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
enumflags2 = "0.7"
async-io = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
enigo = { version = "0.6", default-features = false }
