[package]
name = "linkshot-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Locates the helper programs LinkShot ships with (ffmpeg, tesseract, OCR models)"

[features]
# Carry the tool bundle (a .tar.zst named by LINKSHOT_BUNDLE at build time) inside the executable
# and unpack it on first use. Used for the single-file Windows build.
embedded = ["dep:ruzstd", "dep:tar"]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
directories.workspace = true
ruzstd = { version = "0.9", optional = true }
tar = { version = "0.4", optional = true, default-features = false }
